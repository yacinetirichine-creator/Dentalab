name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — tests et formatage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Installer les dépendances PHP
        working-directory: apps/web
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Préparer l'environnement
        working-directory: apps/web
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Vérifier le formatage (PSR-12)
        working-directory: apps/web
        run: vendor/bin/pint --test

      - name: Lancer les tests
        working-directory: apps/web
        run: php artisan test

  frontend:
    name: Frontend — types et build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Installer Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Installer les dépendances JS
        working-directory: apps/web
        run: npm ci

      - name: Vérifier les types TypeScript
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Construire les assets
        working-directory: apps/web
        run: npm run build
